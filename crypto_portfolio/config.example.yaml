# Copy to config.yaml and fill in.  cp config.example.yaml config.yaml
#
# Secrets do not have to live here: BINANCE_API_KEY / BINANCE_API_SECRET in the
# environment (or in a .env file next to this one) override whatever is below.
# Everything in this file is optional - any key you omit falls back to the defaults
# in config.py, and any section you do not use can be deleted.

binance:
  enabled: true
  # Binance > API Management > create a key with "Enable Reading" ONLY.
  # Do NOT enable trading, withdrawals or futures: this tool never needs them.
  api_key: "YOUR_BINANCE_API_KEY"
  api_secret: "YOUR_BINANCE_API_SECRET"
  recv_window: 5000          # ms a signed request stays valid server-side

wallets:
  # Public addresses only - never a private key or a seed phrase.
  evm:
    - address: "0x0000000000000000000000000000000000000000"
      label: "main"
      # Omit `chains` to scan all five: ethereum, bsc, arbitrum, base, polygon.
      chains: [ethereum, arbitrum, base, bsc, polygon]
    # - address: "0x1111111111111111111111111111111111111111"
    #   label: "cold"
    #   chains: [ethereum]

  solana:
    - address: "11111111111111111111111111111111"
      label: "phantom"
      # Optional: pretty names for mints the pricing API cannot label.
      # tokens:
      #   EPjFWdd5AufqSSqeM2qN1xzybapC8G4wEGGkZwyTDt1v: USDC

# ERC-20 tokens to read per chain. Native coins (ETH/BNB/POL) are always included.
# `symbol` and `decimals` are optional - they are read from the contract when omitted,
# at the cost of two extra RPC calls per token.
chains:
  ethereum:
    tokens:
      - { symbol: USDC, address: "0xa0b86991c6218b36c1d19d4a2e9eb0ce3606eb48", decimals: 6 }
      - { symbol: USDT, address: "0xdac17f958d2ee523a2206206994597c13d831ec7", decimals: 6 }
      - { symbol: WBTC, address: "0x2260fac5e5542a773aa44fbcfedf7c193bc2c599", decimals: 8 }
  arbitrum:
    tokens:
      - { symbol: USDC, address: "0xaf88d065e77c8cc2239327c5edb3a432268e5831", decimals: 6 }
  base:
    tokens:
      - { symbol: USDC, address: "0x833589fcd6edb6e08f4c7c32d4f71b54bda02913", decimals: 6 }
  bsc:
    tokens:
      - { symbol: USDT, address: "0x55d398326f99059ff775485246999027b3197955", decimals: 18 }
  polygon:
    tokens:
      - { symbol: USDC, address: "0x3c499c542cef5e3811e1192ce70d8cc03d5c3359", decimals: 6 }
  # Each chain also accepts `rpcs: [...]` to replace the built-in public endpoints,
  # e.g. your own Alchemy/Infura/QuickNode URL for higher rate limits:
  # ethereum:
  #   rpcs: ["https://eth-mainnet.g.alchemy.com/v2/YOUR_KEY"]

settings:
  min_value: 1.0                        # dust filter in USD; --min-value overrides it
  db_path: "portfolio_history.db"       # relative paths resolve next to main.py
  charts_dir: "./charts"
  timeout: 20                           # seconds per HTTP request
  max_workers: 8                        # parallel chain/wallet fetches
  stablecoins: [USDT, USDC, FDUSD, DAI, TUSD, USDP, PYUSD, USDE]   # pinned at $1.00
  # web_token: "long-random-string"     # guards the web API; PORTFOLIO_WEB_TOKEN wins over it

# Deposits, withdrawals, fiat and P2P orders read from Binance (read-only key is enough).
# They let `python main.py pnl` tell real profit apart from money you moved in or out.
# A withdrawal to one of the wallets above (on a chain that wallet tracks) is an internal
# transfer: it leaves Binance but stays in the portfolio, so it is not counted as a flow.
cash_flows:
  enabled: true
  backfill_days: 1827       # deposits/withdrawals/fiat/P2P: synced this far back (5 years max)
  earn_backfill_days: 365   # Earn rewards: synced AND kept only this far back (older rows pruned)
  overlap_days: 2           # later syncs re-read this much (pending -> completed)
  sync_fiat: true           # bank deposits/withdrawals and card purchases
  sync_p2p: true            # P2P buy/sell orders

# Balances no API can read: BTC on a hardware wallet, a validator, another exchange (Epic M6).
# `label` is unique and keys the history (snapshots, cash flows) - avoid renaming it.
# `linked_wallet` (optional) names a wallet configured above that is the SAME device, e.g. the
# Ledger whose EVM address is tracked: the Wallets tab then shows its on-chain coins and these
# manual coins in one card. Display only - PnL/TWR/snapshot sources keep them apart. It must
# match a `wallets.evm` / `wallets.solana` label, otherwise it is reported and ignored.
# manual_assets:
#   - label: Ledger BTC
#     kind: cold_wallet               # cold_wallet | staking | other
#     linked_wallet: main             # optional
#     holdings:
#       - { symbol: BTC, quantity: 0.25 }
#   - label: Kiln validator
#     kind: staking
#     holdings:
#       - { symbol: ETH, quantity: 2.0, liquid: false }   # liquid: false -> never suggested for sale
