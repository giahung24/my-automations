                                @click="deleteManual(index)" :aria-label="armedManual === index ? 'Confirm delete' : 'Delete ' + asset.label">
                          <svg class="icon icon-sm"><use href="#i-trash"/></svg>
                          <span v-if="armedManual === index" class="text-[13px]">Delete?</span>
                        </button>
                      </div>
                      <p v-if="asset.review_hint" class="field-msg warn"><svg class="icon icon-xs"><use href="#i-alert"/></svg><span>{{ asset.review_hint }}</span></p>
                    </li>
                  </ul>
                  <p v-else-if="!manualDraft" class="mt-4 text-[13px] text-ink-3">Nothing yet. Add the BTC on your hardware wallet, ETH staked with a validator or coins on another exchange: they are priced and counted like everything else.</p>

                  <!-- Manual asset editor -->
                  <div v-if="manualDraft" class="mt-4 rounded-2xl border border-line bg-surface-2/60 p-3.5" ref="manualEl">
                    <p class="mb-3 text-[14px] font-extrabold">{{ manualDraft.index === -1 ? 'Add manual asset' : 'Edit ' + (form.manual[manualDraft.index] || {}).label }}</p>
                    <label class="label" for="manual-label">Name</label>
                    <div class="field mb-3" :class="{ 'is-invalid': manualDraft.labelError }">
                      <input id="manual-label" v-model="manualDraft.label" maxlength="40" placeholder="e.g. Ledger, Lido, Kraken" autocomplete="off"
                             enterkeyhint="next" :aria-invalid="manualDraft.labelError ? 'true' : null">
                    </div>

                    <p class="label" id="manual-kind-label">Type</p>
                    <div class="flex flex-wrap gap-2" role="group" aria-labelledby="manual-kind-label">
                      <button v-for="k in manualKinds" :key="k.id" type="button" class="chain-toggle" style="--chain: #8AB4FF"
                              :aria-pressed="manualDraft.kind === k.id" @click="manualDraft.kind = k.id">{{ k.label }}</button>
                    </div>

                    <p class="label mt-4" id="manual-holdings-label">Balances</p>
                    <ul class="space-y-2" aria-labelledby="manual-holdings-label">
                      <li v-for="(h, j) in manualDraft.holdings" :key="j" class="holding-row">
                        <div class="field holding-sym" :class="{ 'is-invalid': h.invalid === 'symbol' || h.invalid === 'duplicate' }">
                          <input v-model.trim="h.symbol" placeholder="BTC" maxlength="20" autocapitalize="characters" autocomplete="off"
                                 autocorrect="off" spellcheck="false" :aria-label="'Coin ' + (j + 1)" enterkeyhint="next">
                        </div>
                        <div class="field holding-qty" :class="{ 'is-invalid': h.invalid === 'quantity' }">
                          <input v-model="h.quantity" inputmode="decimal" placeholder="0.00" autocomplete="off" class="num"
                                 :aria-label="'Quantity of ' + (h.symbol || 'coin ' + (j + 1))" enterkeyhint="done" @keydown.enter.prevent="applyManual">
                        </div>
                        <button type="button" class="icon-btn" @click="removeHolding(j)" :disabled="manualDraft.holdings.length === 1"
                                :aria-label="'Remove ' + (h.symbol || 'this balance')">
                          <svg class="icon icon-sm"><use href="#i-x"/></svg>
                        </button>
                      </li>
                    </ul>
                    <button type="button" class="btn btn-ghost mt-2 -ml-2.5" @click="addHolding">
                      <svg class="icon icon-sm"><use href="#i-plus"/></svg>Add another coin
                    </button>

                    <p v-if="manualDraft.error" class="field-msg error mt-2" role="alert">
                      <svg class="icon icon-xs"><use href="#i-alert"/></svg><span>{{ manualDraft.error }}</span>
                    </p>
                    <p class="hint mt-2">Priced from Binance, then DefiLlama. Changing a quantity later is recorded as a deposit or withdrawal, not as profit.</p>

                    <div class="mt-4 grid grid-cols-2 gap-2">
                      <button type="button" class="btn btn-ghost" @click="cancelManual">Cancel</button>
                      <button type="button" class="btn btn-secondary" @click="applyManual">
                        <svg class="icon icon-sm"><use href="#i-check"/></svg>{{ manualDraft.index === -1 ? 'Add to list' : 'Update' }}
                      </button>
                    </div>
                  </div>

                  <button v-if="!manualDraft" type="button" class="btn btn-secondary mt-4 w-full" @click="newManual">
                    <svg class="icon icon-sm"><use href="#i-plus"/></svg>Add manual asset
                  </button>
                </section>

                <p class="mt-4 px-1 text-[12px] leading-relaxed text-ink-3">
                  Saved to <span class="break-all font-mono">{{ settings.config_path }}</span> (owner-only permissions; the previous file is kept as <span class="font-mono">.bak</span>). Secrets are never sent back to this page.
                </p>
              </template>
            </div>

            <div class="sheet-foot">
              <p v-if="saveError" class="field-msg error mb-2 mt-0" role="alert">
                <svg class="icon icon-xs"><use href="#i-alert"/></svg><span class="min-w-0 break-words">{{ saveError }}</span>
              </p>
              <button type="button" class="btn btn-primary btn-block" @click="saveSettings" :disabled="!settings || saving || !dirty || !!draft || !!manualDraft || !!saveBlocker">
                {{ saving ? 'Saving…' : (draft ? 'Finish the wallet first' : manualDraft ? 'Finish the manual asset first' : (saveBlocker || (dirty ? 'Save settings' : 'No changes'))) }}
              </button>
            </div>
          </div>
        </div>
      </transition>

      <!-- "Why it moved" peek: the 24h move at a glance, opened from the hero chip -->
      <transition name="sheet">
        <div v-if="peek.open" class="sheet-backdrop" @click.self="closePeek()" @keydown="onPeekKeydown">
          <div class="sheet peek" role="dialog" aria-modal="true" aria-labelledby="peek-title" ref="peekSheet" :aria-busy="peek.loading">
            <div class="sheet-grip" aria-hidden="true"></div>
            <div class="flex items-center justify-between py-2 pl-5 pr-2">
              <h2 id="peek-title" class="text-[19px] font-extrabold tracking-tight">Why it moved
                <span class="font-bold text-ink-3">· {{ peekReady ? peekSpan : '24h' }}</span></h2>
              <button type="button" class="icon-btn" @click="closePeek()" aria-label="Close" ref="peekClose">
                <svg class="icon"><use href="#i-x"/></svg>
              </button>
            </div>

            <div class="sheet-body px-4 pb-4">
              <div v-if="peek.loading && !peek.data" class="space-y-3 px-1 py-2">
                <div class="skeleton h-9 w-48"></div>
                <div class="grid grid-cols-2 gap-2"><div class="skeleton h-16"></div><div class="skeleton h-16"></div></div>
                <div v-for="n in 3" :key="n" class="skeleton h-10 w-full"></div>
              </div>
              <template v-else-if="peekReady">
                <p class="delta-figure num pnl px-1" :class="peekTrend">
                  <span class="priv">{{ fmt.signedMoney(peek.data.delta_usd) }}</span>
                  <span v-if="peek.data.delta_pct !== null" class="delta-pct">{{ fmt.signedPct(peek.data.delta_pct) }}</span>
                </p>
                <p v-if="peekSpanNote" class="mt-0.5 px-1 text-[12px] font-semibold text-ink-3 num">over {{ peekSpan }} ({{ peekSpanNote }})</p>
                <ul class="bucket-tiles mt-3" aria-label="Where the change came from">
                  <li v-for="bucket in peekBuckets" :key="bucket.id" class="bucket-tile" :class="'bucket-' + bucket.id" :title="bucket.hint">
                    <span class="block text-[12px] font-semibold text-ink-3">{{ bucket.label }}</span>
                    <span class="pnl num block text-[16px] font-extrabold" :class="bucket.trend">
                      <span class="priv priv-soft">{{ fmt.signedMoney(bucket.value) }}</span>
                    </span>
                  </li>
                </ul>
                <h3 v-if="peekRows.length" class="block-sub mt-4 px-1">Biggest movers</h3>
                <ul v-if="peekRows.length" class="why-list peek-list mt-1" aria-label="Coins that moved the total most">
                  <li v-for="r in peekRows" :key="r.key" class="why-row" :title="r.breakdown">
                    <span class="coin coin-sm" :style="{ '--hue': fmt.hue(r.key) }" aria-hidden="true">
                      <img v-if="coinIcon(r.key)" :src="coinIcon(r.key)" alt="" @error="iconFailed[r.key] = true">
                      <span v-else>{{ fmt.badge(r.key) }}</span>
                    </span>
                    <span class="min-w-0">
                      <span class="block truncate text-[14px] font-extrabold tracking-tight">{{ r.key }}</span>
                      <span class="block truncate text-[12px] font-semibold text-ink-3 num">{{ r.note }}</span>
                    </span>
                    <span class="why-bar" aria-hidden="true">
                      <i :class="[r.trend, { qty: !r.byPrice }]" :style="{ width: r.width + '%' }"></i>
                    </span>
                    <span class="pnl num whitespace-nowrap text-right text-[14px] font-extrabold" :class="r.trend">
                      <svg class="icon icon-xs"><use :href="r.trend === 'down' ? '#i-down' : '#i-up'"/></svg>
                      <span class="priv priv-soft">{{ fmt.signedMoney(r.total) }}</span>
                      <span class="sr-only">{{ r.breakdown }}</span>
                    </span>
                  </li>
                </ul>
              </template>
              <p v-if="peekMessage" class="px-1 pt-2 text-[13px] font-semibold text-ink-3">{{ peekMessage }}</p>
            </div>

            <div class="sheet-foot">
              <button type="button" class="btn btn-primary btn-block" @click="peekToAnalytics">
                See full analysis <span aria-hidden="true">→</span>
              </button>
            </div>
          </div>
        </div>
      </transition>

      <div class="toast-wrap" aria-live="polite">
        <!-- 5 s to take back an Activity confirmation (M4.6 AC3) -->
        <transition name="toast">
          <div v-if="act.undo && activeTab === 'activity'" class="toast undo-bar" role="status">
            <svg class="icon icon-sm"><use href="#i-check"/></svg>
            <span class="min-w-0 flex-1">{{ act.undo.text }}</span>
            <button type="button" class="link-btn hit" style="--hit: -14px -12px" @click="undoConfirm">Undo</button>
          </div>
        </transition>
        <transition name="toast">
          <div v-if="toast" class="toast" :class="toast.kind" :key="toast.id" role="status">
            <svg class="icon icon-sm"><use :href="toast.kind === 'error' ? '#i-alert' : '#i-check'"/></svg>
            <span>{{ toast.text }}</span>
          </div>
        </transition>
      </div>
    </template>
  </div>

  <script src="/static/vendor/vue.global.prod.js"></script>
  <script src="/static/vendor/lightweight-charts.standalone.production.js"></script>
  <script src="/static/app.js"></script>
</body>
</html>
