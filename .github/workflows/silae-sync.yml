name: Weekly Silae Shift Sync

on:
  schedule:
    - cron: '0 5 * * *'  # Runs at 05:00 UTC
  workflow_dispatch:  # Allows manual trigger

jobs:
  sync-shifts:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: silae_planning

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Create credentials directory
        run: mkdir -p credentials

      - name: Set up Google service account key
        env:
          GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
        run: |
          if [ -z "$GOOGLE_CREDENTIALS_JSON" ]; then
            echo "::error::GOOGLE_CREDENTIALS_JSON secret is empty"
            exit 1
          fi
          printf '%s' "$GOOGLE_CREDENTIALS_JSON" > credentials/google_credentials.json
          # Fail fast if the secret is not a service account key
          python3 -c 'import json,sys; d=json.load(open("credentials/google_credentials.json")); assert d.get("type")=="service_account", "not a service account key (type=%r)" % d.get("type"); print("Service account:", d["client_email"])'
          chmod 755 credentials/
          chmod 644 credentials/google_credentials.json

      - name: Create logs directory
        run: mkdir -p logs

      - name: Create .env file
        run: |
          echo "GOOGLE_CREDENTIALS_FILE=credentials/google_credentials.json" >> .env
          echo "HOTEL_CALENDAR_ID=${{ secrets.HOTEL_CALENDAR_ID }}" >> .env

          echo "SILAE_BASE_URL=${{ secrets.SILAE_BASE_URL }}" >> .env
          echo "SILAE_USERNAME=${{ secrets.SILAE_USERNAME }}" >> .env
          echo "SILAE_PASSWORD=${{ secrets.SILAE_PASSWORD }}" >> .env
          echo "EMPLOYEE_ID=${{ secrets.EMPLOYEE_ID }}" >> .env

          echo "SILAE_VERIFY_SSL=false" >> .env
          echo "TIMEZONE=Europe/Paris" >> .env
          echo "LOG_LEVEL=INFO" >> .env


      - name: Run Docker Compose
        run: |
          docker compose up --build --abort-on-container-exit
          docker compose down
